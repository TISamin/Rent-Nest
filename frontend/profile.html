<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Profile | RentNest</title>
  <meta name="description" content="Manage your RentNest profile, upload a photo, and update your personal details.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FF385C', dark: '#E31C5F' },
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.08)',
            hover: '0 6px 24px rgba(0,0,0,0.14)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Firebase Storage CDN (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
  <style>
    .avatar-container { position: relative; cursor: pointer; }
    .avatar-container:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(0,0,0,0.45); display: flex;
      align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col">

  <!-- Navbar (injected by ui-common.js) -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300"></nav>

  <!-- Profile Content -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg">

      <!-- Profile Card -->
      <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-card border border-gray-100">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold tracking-tight text-gray-900">Your Profile</h1>
          <p class="text-gray-500 text-sm mt-1">Keep your personal details up to date</p>
        </div>

        <form id="profile-form" class="space-y-5">
          <!-- Avatar Upload -->
          <div class="flex justify-center mb-6">
            <div class="avatar-container w-28 h-28" onclick="document.getElementById('photo-input').click()">
              <img id="avatar-preview" src="https://ui-avatars.com/api/?name=User&background=FF385C&color=fff&size=128&rounded=true" alt="Profile avatar"
                class="w-28 h-28 rounded-full object-cover border-4 border-white shadow-md">
              <div class="avatar-overlay">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
              </div>
              <input type="file" id="photo-input" accept="image/*" class="hidden">
              <input type="hidden" id="photo-url-hidden">
            </div>
          </div>
          <p class="text-xs text-center text-gray-400 -mt-3 mb-2">Click avatar to change photo</p>

          <!-- Email Display (readonly) -->
          <div class="relative floating-label-group border border-gray-200 rounded-lg px-3 py-2 bg-gray-50">
            <input type="email" id="profile-email-display" placeholder=" " readonly
              class="peer w-full bg-transparent outline-none text-gray-400 text-base pt-3 pb-1 placeholder-transparent cursor-not-allowed">
            <label for="profile-email-display" class="absolute left-3 top-1 text-gray-400 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5">
              Email Address (login)
            </label>
          </div>

          <!-- Full Name -->
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="text" id="profile-name" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="profile-name" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Full Name *
            </label>
          </div>

          <!-- Secondary Contact Email -->
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="email" id="profile-email" placeholder=" "
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="profile-email" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Contact Email
            </label>
          </div>

          <!-- Phone -->
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="tel" id="profile-phone" placeholder=" "
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="profile-phone" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Phone Number
            </label>
          </div>

          <!-- Address -->
          <div class="relative border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <label for="profile-address" class="block text-xs text-gray-500 mb-1">Address</label>
            <textarea id="profile-address" rows="2" placeholder="Your address..."
              class="w-full bg-transparent outline-none text-gray-800 text-base placeholder-gray-400 resize-none"></textarea>
          </div>

          <!-- Save Button -->
          <button type="submit" id="save-profile-btn"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Save Changes
          </button>
        </form>

        <!-- Danger Zone -->
        <div class="mt-8 pt-6 border-t border-gray-100">
          <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Account</h3>
          <a href="forgot-password.html" class="text-sm text-primary hover:underline font-medium">Change Password →</a>
        </div>
      </div>

      <p class="text-center text-gray-400 text-xs mt-6">
        Your data is private and securely stored.
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
