<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Banned | RentNest</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 text-center border-t-4 border-red-500">
    <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>
    
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Account Banned</h1>
    <p class="text-gray-600 mb-6">Your access to RentNest has been revoked due to a violation of our terms of service.</p>
    
    <div class="bg-red-50 border border-red-100 rounded-xl p-4 mb-8 text-left">
      <span class="block text-sm font-semibold text-red-800 mb-1">Reason for ban:</span>
      <span id="banReasonText" class="text-sm text-red-600">Loading...</span>
    </div>

    <a href="index.html" class="inline-block w-full py-3 px-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-xl transition-colors">
      Return to Homepage
    </a>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const reason = urlParams.get('reason');
      document.getElementById('banReasonText').textContent = reason ? reason : 'No specific reason provided.';
    });
  </script>
</body>
</html>
