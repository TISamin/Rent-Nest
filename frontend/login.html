<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | RentNest</title>
  <meta name="description" content="Sign in to RentNest with your email and password to access rentals, services, and roommates.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200"></nav>

  <!-- Login Content -->
  <main class="relative flex-1 flex items-center justify-center px-4 py-16 overflow-hidden">
    <div class="relative z-10 w-full max-w-md">
      <!-- Surface Card -->
      <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-card border border-gray-100">
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">🔐</div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900">Welcome Back</h1>
          <p class="text-gray-500 text-sm mt-1">Sign in to your RentNest account</p>
        </div>

        <form id="loginForm" onsubmit="handleLoginSubmit(event)" class="space-y-6">
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="email" id="emailInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="emailInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Email Address
            </label>
          </div>

          <div>
            <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white mb-2">
              <input type="password" id="passwordInput" placeholder=" " required
                class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
              <label for="passwordInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
                Password
              </label>
            </div>
            <div class="flex justify-end">
              <a href="forgot-password.html" class="text-xs text-primary font-medium hover:underline">Forgot Password?</a>
            </div>
          </div>

          <button type="submit" id="loginSubmitBtn"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Login
          </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500">
          Don't have an account? 
          <a href="signup.html" class="text-primary font-medium hover:underline">Sign Up</a>
        </div>
      </div>

      <p class="text-center text-gray-400 text-xs mt-6">
        By continuing, you agree to RentNest's Terms of Service and Privacy Policy.
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-common.js"></script>
  <script>
    // Redirect if authenticated
    if (isAuthenticated()) {
      window.location.href = 'index.html';
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;

      if (!email || !password) {
        showToast('Please enter both email and password.', 'warning');
        return;
      }

      const btn = document.getElementById('loginSubmitBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Logging in...';
      btn.classList.add('btn-loading');

      await loginWithPassword(email, password);

      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }
  </script>
</body>
</html>
