server {
    listen 80;
    server_name localhost;

    # Root directory where static files are served from
    root /usr/share/nginx/html;
    index index.html;

    # ==========================================
    # Gzip Compression (makes pages load faster)
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ==========================================
    # Reverse Proxy: Forward /api requests to the Spring Boot backend
    # ==========================================
    # When the frontend makes a request to /api/..., Nginx forwards it
    # to the backend container (named "backend" in docker-compose).
    # This avoids CORS issues because the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for slow API responses (e.g., AI features)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # Support large file uploads (images via Cloudinary are client-side,
        # but listing creation payloads can be large)
        client_max_body_size 200M;
    }

    # ==========================================
    # Static File Caching
    # ==========================================
    # Cache images and fonts for 7 days
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Do not cache HTML, CSS, or JS files during development
    location ~* \.(html|css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ==========================================
    # Clean URLs (matches Vercel's cleanUrls behavior)
    # ==========================================
    # Try the exact URI, then URI.html, then URI/index.html, then 404
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ==========================================
    # Security Headers
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
