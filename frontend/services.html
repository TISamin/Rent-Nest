<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Services | RentNest</title>
  <meta name="description" content="Find shifting services, event planning, decoration, catering, cleaning, and maintenance on RentNest.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FF385C', dark: '#E31C5F' },
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.08)',
            hover: '0 6px 24px rgba(0,0,0,0.14)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .tab-btn { transition: all 0.2s ease; }
    .tab-btn.active {
      background-color: #FF385C;
      color: #fff;
      border-color: #FF385C;
    }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col">

  <!-- Navbar (injected by ui-common.js) -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300"></nav>

  <!-- Page Header -->
  <div class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-gray-900">Browse Services</h1>
          <p class="text-gray-500 mt-1">Hire shifting help, catering, event planners, decoration, cleaning, or maintenance.</p>
        </div>
        <a href="post-listing.html?category=SHIFTING_SERVICE"
          class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow transition-all active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Add a Service
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">

    <!-- Search + Filter Bar -->
    <form id="search-filter-form" class="bg-white border border-gray-200 rounded-2xl p-5 mb-8 flex flex-col sm:flex-row gap-4 items-end shadow-sm">
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Location</label>
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          <input type="text" id="search-location" placeholder="Search by location..."
            class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all">
        </div>
      </div>
      <button type="submit" class="px-6 py-2.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow transition-all active:scale-95 flex items-center gap-2 whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Search
      </button>
    </form>

    <!-- Category Tabs -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button class="tab-btn active px-4 py-2 rounded-full border border-gray-300 text-sm font-semibold hover:border-primary transition-all" data-category="">All Services</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="SHIFTING_SERVICE">🚚 Shifting</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="EVENT_PLANNING">🎉 Event Planning</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="DECORATION_SERVICE">🎨 Decoration</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="MAINTENANCE_SERVICE">🔧 Maintenance</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="CLEANING_SERVICE">🧹 Cleaning</button>
      <button class="tab-btn px-4 py-2 rounded-full border border-gray-300 text-gray-600 text-sm font-medium hover:border-primary transition-all" data-category="CATERING_SERVICE">🍽️ Catering</button>
    </div>

    <!-- Results Grid -->
    <div id="listings-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Populated by services.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500 w-full mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/services.js"></script>
  <script>
    // Tab switching logic
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // services.js listens to custom event
        const event = new CustomEvent('categoryChange', { detail: btn.dataset.category });
        document.dispatchEvent(event);
      });
    });

    // Pre-select tab from URL params
    const urlCat = new URLSearchParams(window.location.search).get('type');
    if (urlCat) {
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        if (b.dataset.category === urlCat) b.classList.add('active');
      });
    }
  </script>
</body>
</html>
