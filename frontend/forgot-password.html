<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | RentNest</title>
  <meta name="description" content="Reset your RentNest account password using email OTP verification.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <!-- EmailJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    /* OTP digit boxes styling matching light theme */
    .otp-input {
      width: 52px;
      height: 58px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s;
    }
    .otp-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.15);
    }
    .step-hidden { display: none; }
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200"></nav>

  <!-- Forgot Password Content -->
  <main class="relative flex-1 flex items-center justify-center px-4 py-16 overflow-hidden">
    <div class="relative z-10 w-full max-w-md">
      <!-- Surface Card -->
      <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-card border border-gray-100">
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">🔑</div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900" id="authTitle">Reset Password</h1>
          <p class="text-gray-500 text-sm mt-1" id="authSubtitle">Recover your account using email OTP verification</p>
        </div>

        <!-- Step 1: Email Input -->
        <div id="step1">
          <div class="mb-6 relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="email" id="emailInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="emailInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Email Address
            </label>
          </div>
          <button id="sendOtpBtn" onclick="handleSendOtp()"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Request Reset Code
          </button>
        </div>

        <!-- Step 2: OTP & New Password -->
        <div id="step2" class="step-hidden space-y-6">
          <p class="text-center text-gray-500 text-sm">
            We sent a reset code to <span id="sentEmailDisplay" class="text-primary font-medium"></span>
          </p>
          <div>
            <label class="block text-sm font-medium text-gray-600 mb-3 text-center">Verification Code</label>
            <div class="flex justify-center gap-3" id="otpContainer">
              <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric">
              <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric">
              <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric">
              <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric">
              <input type="text" maxlength="1" class="otp-input" data-index="4" inputmode="numeric">
              <input type="text" maxlength="1" class="otp-input" data-index="5" inputmode="numeric">
            </div>
          </div>
          
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="password" id="passwordInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="passwordInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              New Password (Min 6 chars)
            </label>
          </div>
          
          <button id="resetBtn" onclick="handleResetSubmit()"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Reset Password
          </button>
          
          <div class="text-center pt-2">
            <button onclick="goBackToEmail()" class="text-sm text-gray-500 hover:text-primary transition-colors underline underline-offset-4">
              Change Email / Back
            </button>
          </div>
        </div>

        <div class="mt-6 text-center text-sm text-gray-500">
          Remember password? 
          <a href="login.html" class="text-primary font-medium hover:underline">Login</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-common.js"></script>
  <script>
    // Redirect if authenticated
    if (isAuthenticated()) {
      window.location.href = 'index.html';
    }

    // OTP inputs mapping
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        if (val && i < otpInputs.length - 1) {
          otpInputs[i + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          otpInputs[i - 1].focus();
        }
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((ch, j) => {
          if (otpInputs[j]) otpInputs[j].value = ch;
        });
        if (pasted.length > 0) otpInputs[Math.min(pasted.length, 5)].focus();
      });
    });

    let storedEmail = '';

    async function handleSendOtp() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email address.', 'warning');
        return;
      }
      const btn = document.getElementById('sendOtpBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Requesting...';
      btn.classList.add('btn-loading');

      const success = await requestForgotPasswordOtp(email);
      if (success) {
        storedEmail = email;
        document.getElementById('sentEmailDisplay').textContent = email;
        document.getElementById('step1').classList.add('step-hidden');
        document.getElementById('step2').classList.remove('step-hidden');
        document.getElementById('authTitle').textContent = 'Confirm Reset';
        document.getElementById('authSubtitle').textContent = 'Enter verification code and configure your new password';
        otpInputs[0].focus();
      }
      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }

    async function handleResetSubmit() {
      const otp = Array.from(otpInputs).map(i => i.value).join('');
      const password = document.getElementById('passwordInput').value;

      if (otp.length !== 6) {
        showToast('Please enter all 6 digits of the verification code.', 'warning');
        return;
      }
      if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'warning');
        return;
      }

      const btn = document.getElementById('resetBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Resetting...';
      btn.classList.add('btn-loading');
      
      const success = await resetForgotPassword(storedEmail, otp, password);
      if (!success) {
        const container = document.getElementById('otpContainer');
        container.classList.add('shake-element');
        setTimeout(() => container.classList.remove('shake-element'), 500);
      }
      
      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }

    function goBackToEmail() {
      document.getElementById('step2').classList.add('step-hidden');
      document.getElementById('step1').classList.remove('step-hidden');
      document.getElementById('authTitle').textContent = 'Reset Password';
      document.getElementById('authSubtitle').textContent = 'Recover your account using email OTP verification';
      otpInputs.forEach(i => i.value = '');
      document.getElementById('passwordInput').value = '';
    }
  </script>
</body>
</html>
