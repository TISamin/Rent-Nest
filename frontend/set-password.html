<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | RentNest</title>
  <meta name="description" content="Configure a secure password for your RentNest account.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-heading { font-family: 'Outfit', 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0a0e17; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
    .gradient-text { background: linear-gradient(135deg, #10b981, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .hero-orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.2; }
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#0a0e17] text-gray-100 min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full z-50 bg-gray-900/80 backdrop-blur-xl border-b border-white/10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center space-x-2">
          <span class="text-2xl">🏠</span>
          <span class="text-xl font-bold font-heading bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">RentNest</span>
        </a>
        <div class="hidden md:flex items-center space-x-8">
          <a href="browse-rental.html" class="text-gray-300 hover:text-white transition-colors duration-200">Rentals</a>
          <a href="services.html" class="text-gray-300 hover:text-white transition-colors duration-200">Services</a>
          <a href="marketplace.html" class="text-gray-300 hover:text-white transition-colors duration-200">Marketplace</a>
          <a href="roommate-finder.html" class="text-gray-300 hover:text-white transition-colors duration-200">Roommates</a>
          <a href="post-listing.html" class="text-gray-300 hover:text-white transition-colors duration-200">Post Ad</a>
        </div>
        <div class="flex items-center space-x-4">
          <button id="logoutBtn" class="px-4 py-2 rounded-lg text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-all duration-300 text-sm">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Set Password Content -->
  <main class="relative min-h-screen flex items-center justify-center px-4 pt-20 pb-12 overflow-hidden">
    <!-- Background orbs -->
    <div class="hero-orb w-80 h-80 bg-emerald-500 -top-20 -left-40"></div>
    <div class="hero-orb w-64 h-64 bg-cyan-500 -bottom-20 -right-32"></div>

    <div class="relative z-10 w-full max-w-md">
      <!-- Glass Card -->
      <div class="glass rounded-2xl p-8 sm:p-10 animate-fade-in-up">
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">🛡️</div>
          <h1 class="text-2xl font-bold font-heading">Secure Your Account</h1>
          <p class="text-gray-400 text-sm mt-1">Please set a password to complete registration</p>
        </div>

        <form id="setPasswordForm" onsubmit="handleSetPassword(event)" class="space-y-5">
          <div>
            <label for="passwordInput" class="block text-sm font-medium text-gray-300 mb-2">Password (Min 6 characters)</label>
            <input type="password" id="passwordInput" placeholder="••••••••" required
              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200">
          </div>
          <div>
            <label for="confirmPasswordInput" class="block text-sm font-medium text-gray-300 mb-2">Confirm Password</label>
            <input type="password" id="confirmPasswordInput" placeholder="••••••••" required
              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-200">
          </div>

          <button type="submit" id="submitBtn"
            class="w-full py-3 mt-2 rounded-xl bg-gradient-to-r from-emerald-500 to-cyan-500 text-white font-semibold hover:shadow-lg hover:shadow-emerald-500/25 transition-all duration-300 hover:scale-[1.02]">
            Save Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Force log out handler
    document.getElementById('logoutBtn')?.addEventListener('click', () => { logout(); });

    // Enforce authentication context
    if (!isAuthenticated()) {
      window.location.href = 'login.html';
    }

    async function handleSetPassword(event) {
      event.preventDefault();
      const password = document.getElementById('passwordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'warning');
        return;
      }
      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.textContent = 'Saving...';
      btn.classList.add('btn-loading');

      const success = await setPassword(password);

      btn.textContent = 'Save Password';
      btn.classList.remove('btn-loading');
    }
  </script>
</body>
</html>
