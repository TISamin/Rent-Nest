<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | RentNest</title>
  <meta name="description" content="Configure a secure password for your RentNest account.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200"></nav>

  <!-- Set Password Content -->
  <main class="relative flex-1 flex items-center justify-center px-4 py-16 overflow-hidden">
    <div class="relative z-10 w-full max-w-md">
      <!-- Surface Card -->
      <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-card border border-gray-100">
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">🛡️</div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900">Secure Your Account</h1>
          <p class="text-gray-500 text-sm mt-1">Please set a password to complete registration</p>
        </div>

        <form id="setPasswordForm" onsubmit="handleSetPassword(event)" class="space-y-6">
          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="password" id="passwordInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="passwordInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Password (Min 6 characters)
            </label>
          </div>

          <div class="relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="password" id="confirmPasswordInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="confirmPasswordInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Confirm Password
            </label>
          </div>

          <button type="submit" id="submitBtn"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Save Password
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-common.js"></script>
  <script>
    // Enforce authentication context
    if (!isAuthenticated()) {
      window.location.href = 'login.html';
    }

    async function handleSetPassword(event) {
      event.preventDefault();
      const password = document.getElementById('passwordInput').value;
      const confirmPassword = document.getElementById('confirmPasswordInput').value;

      if (!password || password.length < 6) {
        showToast('Password must be at least 6 characters long.', 'warning');
        return;
      }
      if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Saving...';
      btn.classList.add('btn-loading');

      const success = await setPassword(password);

      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }
  </script>
</body>
</html>
