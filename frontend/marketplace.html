<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace | RentNest</title>
  <meta name="description" content="Buy and sell furniture, electronics, and more on the RentNest Marketplace.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#FF385C', dark: '#E31C5F' },
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.08)',
            hover: '0 6px 24px rgba(0,0,0,0.14)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col">

  <!-- Navbar (injected by ui-common.js) -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300"></nav>

  <!-- Page Header -->
  <div class="bg-white border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-gray-900">Marketplace</h1>
          <p class="text-gray-500 mt-1">Buy, sell, and trade items with people near you.</p>
        </div>
        <a href="post-listing.html?category=MARKETPLACE"
          class="inline-flex items-center gap-2 px-5 py-3 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow transition-all active:scale-95">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
          Sell an Item
        </a>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1">

    <!-- Search Bar -->
    <form id="marketplace-search-form" class="bg-white border border-gray-200 rounded-2xl p-5 mb-8 flex flex-col sm:flex-row gap-4 items-end shadow-sm">
      <div class="flex-1 w-full">
        <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1.5">Search Items</label>
        <div class="relative flex items-center">
          <svg class="w-4 h-4 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          <input type="text" id="search-item" placeholder="Search furniture, electronics, books..."
            class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all">
        </div>
      </div>
      <button type="submit" class="px-6 py-2.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow transition-all active:scale-95 flex items-center gap-2 whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        Search
      </button>
    </form>

    <!-- Listings Grid -->
    <div id="marketplace-listings-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <!-- Populated by marketplace.js -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500 w-full mt-auto">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
