<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Rentals | RentNest</title>
  <meta name="description" content="Browse flats, hotels, houses, and convention halls for rent on RentNest.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Leaflet Map CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Slider Custom Accent Color */
    input[type="range"] {
      accent-color: #FF385C;
    }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300"></nav>

  <!-- Page Content: Split Layout -->
  <main class="max-w-7xl mx-auto w-full px-6 py-8 flex-1 flex flex-col md:flex-row gap-8">
    
    <!-- Left Sidebar: Filters (30% width) -->
    <aside class="w-full md:w-[30%] bg-white rounded-2xl border border-gray-200 p-6 h-fit sticky top-24 shadow-sm space-y-6">
      <h3 class="text-lg font-bold tracking-tight text-gray-900">Filters</h3>
      
      <form id="search-filter-form" class="space-y-6">
        <!-- Location input -->
        <div class="space-y-2">
          <label for="search-location" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Location</label>
          <div class="relative flex items-center">
            <svg class="w-4 h-4 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <input type="text" id="search-location" placeholder="Search locality..."
              class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all">
          </div>
        </div>

        <!-- Category Dropdown -->
        <div class="space-y-2">
          <label for="search-category" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Category</label>
          <select id="search-category" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all bg-white cursor-pointer">
            <option value="">All Categories</option>
            <option value="FLAT">Flat</option>
            <option value="HOTEL">Hotel</option>
            <option value="HOUSE">House</option>
            <option value="CONVENTION_HALL">Convention Hall</option>
          </select>
        </div>

        <!-- Radius Slider -->
        <div class="space-y-2">
          <div class="flex justify-between items-center text-xs font-semibold text-gray-700 uppercase tracking-wider">
            <span>Search Radius</span>
            <span id="radius-val" class="text-primary font-bold">15 km</span>
          </div>
          <input type="range" id="radius-slider" min="1" max="50" value="15" class="w-full cursor-pointer">
        </div>

        <!-- Budget Range -->
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider">Budget Range (BDT)</label>
          <div class="grid grid-cols-2 gap-3">
            <input type="number" id="budget-min" placeholder="Min" class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all">
            <input type="number" id="budget-max" placeholder="Max" class="w-full px-3 py-2 rounded-lg border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all">
          </div>
        </div>

        <!-- Search button -->
        <button type="submit" class="w-full py-3 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-sm tracking-wide shadow transition-all transform active:scale-95 flex items-center justify-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          Apply Filters
        </button>
      </form>
    </aside>

    <!-- Right Main Area: Results Grid / Map View (70% width) -->
    <section class="flex-1 space-y-6">
      
      <!-- Top header layout -->
      <div class="flex justify-between items-center bg-white border border-gray-200 rounded-2xl p-4 sm:p-5 shadow-sm">
        <div>
          <h2 id="results-count" class="text-lg font-bold text-gray-900">Loading spaces...</h2>
        </div>
        <button id="map-toggle-btn" class="px-4 py-2 rounded-full border border-gray-300 hover:border-gray-400 bg-white hover:bg-gray-50 text-sm font-semibold text-gray-700 transition-all flex items-center gap-2 shadow-sm transform active:scale-95 focus:outline-none">
          <span id="map-toggle-icon">🗺️</span> <span id="map-toggle-text">Map View</span>
        </button>
      </div>

      <!-- Main Results Display -->
      <div id="results-view-container" class="relative min-h-[600px]">
        
        <!-- Grid View container -->
        <div id="listings-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 transition-all duration-300">
          <!-- Populated by JS -->
        </div>

        <!-- Map View container (hidden by default) -->
        <div id="leaflet-search-map" class="w-full h-[600px] bg-gray-100 rounded-2xl border border-gray-200 hidden overflow-hidden shadow-inner z-10"></div>
        
        <!-- Empty State container (hidden by default) -->
        <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-8 bg-white border border-gray-200 rounded-2xl">
          <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h3 class="text-lg font-bold text-gray-900 mb-1">No listings found in this area</h3>
          <p class="text-sm text-gray-500 max-w-sm mb-6">We couldn't find any rentals matching your criteria. Try widening your search radius or selecting a different locality.</p>
          <button id="widen-radius-btn" class="px-5 py-2.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-xs shadow-sm transform active:scale-95 transition-all focus:outline-none">
            Widen Search Radius
          </button>
        </div>

      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500 w-full mt-12">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/browse-rental.js"></script>
</body>
</html>
