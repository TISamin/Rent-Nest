<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Rentals | RentNest</title>
  <meta name="description" content="Browse flats, hotels, houses, and convention halls for rent on RentNest.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <!-- Leaflet Map CSS/JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* Slider Custom Accent Color */
    input[type="range"] {
      accent-color: #FF385C;
    }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200 transition-all duration-300"></nav>

  <!-- Top Horizontal Filter Bar -->
  <div class="sticky top-[72px] z-40 bg-white border-b border-gray-200 py-4 shadow-sm w-full">
    <div class="max-w-[1600px] 2xl:max-w-none w-full px-6 md:px-12 lg:px-20 mx-auto">
      <form id="search-filter-form" class="flex flex-col md:flex-row items-center gap-4">
        
        <!-- Location input -->
        <div class="relative flex items-center flex-1 min-w-[200px]">
          <svg class="w-5 h-5 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <input type="text" id="search-location" placeholder="Search destination"
            class="w-full pl-10 pr-4 py-2.5 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all shadow-sm hover:shadow-md">
        </div>

        <!-- Category Dropdown -->
        <div class="w-full md:w-48">
          <select id="search-category" class="w-full px-4 py-2.5 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all bg-white cursor-pointer shadow-sm hover:shadow-md appearance-none">
            <option value="">Any type</option>
            <option value="FLAT">Flat</option>
            <option value="HOTEL">Hotel</option>
            <option value="HOUSE">House</option>
            <option value="CONVENTION_HALL">Convention Hall</option>
          </select>
        </div>

        <!-- Budget Range -->
        <div class="flex items-center gap-2 w-full md:w-auto">
          <input type="number" id="budget-min" placeholder="Min BDT" class="w-full md:w-28 px-4 py-2.5 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all shadow-sm hover:shadow-md">
          <span class="text-gray-400">-</span>
          <input type="number" id="budget-max" placeholder="Max BDT" class="w-full md:w-28 px-4 py-2.5 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all shadow-sm hover:shadow-md">
        </div>

        <!-- Radius Dropdown -->
        <div class="w-full md:w-40">
          <select id="radius-dropdown" class="w-full px-4 py-2.5 rounded-full border border-gray-300 text-sm focus:outline-none focus:ring-2 focus:ring-primary/25 focus:border-primary transition-all bg-white cursor-pointer shadow-sm hover:shadow-md appearance-none">
            <option value="5">Within 5 km</option>
            <option value="15" selected>Within 15 km</option>
            <option value="30">Within 30 km</option>
            <option value="50">Within 50 km</option>
          </select>
        </div>

        <!-- Search button -->
        <button type="submit" class="w-full md:w-auto px-6 py-2.5 rounded-full bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-sm transition-all transform active:scale-95 flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          Search
        </button>
      </form>
    </div>
  </div>

  <!-- Page Content: Full Width Grid -->
  <main class="max-w-[1600px] 2xl:max-w-none w-full px-6 md:px-12 lg:px-20 mx-auto py-8 flex-1 flex flex-col">
    
    <section class="flex-1 space-y-6">
      
      <!-- Top header layout -->
      <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-2">
        <div>
          <h2 id="results-count" class="text-xl font-bold text-gray-900 tracking-tight">Loading spaces...</h2>
        </div>
        <button id="map-toggle-btn" class="px-5 py-2.5 rounded-full border border-gray-300 hover:border-gray-900 bg-white text-sm font-semibold text-gray-900 transition-all flex items-center gap-2 shadow-sm transform active:scale-95 focus:outline-none">
          <span id="map-toggle-icon">🗺️</span> <span id="map-toggle-text">Show map</span>
        </button>
      </div>

      <!-- Main Results Display -->
      <div id="results-view-container" class="relative min-h-[600px]">
        
        <!-- Grid View container -->
        <div id="listings-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-x-6 gap-y-10 transition-all duration-300">
          <!-- Populated by JS -->
        </div>

        <!-- Map View container (hidden by default) -->
        <div id="leaflet-search-map" class="w-full h-[600px] bg-gray-100 rounded-2xl border border-gray-200 hidden overflow-hidden shadow-inner z-10"></div>
        
        <!-- Empty State container (hidden by default) -->
        <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center text-center p-8 bg-white border border-gray-200 rounded-2xl">
          <svg class="w-24 h-24 text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <h3 class="text-lg font-bold text-gray-900 mb-1">No listings found in this area</h3>
          <p class="text-sm text-gray-500 max-w-sm mb-6">We couldn't find any rentals matching your criteria. Try widening your search radius or selecting a different locality.</p>
          <button id="widen-radius-btn" class="px-5 py-2.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-bold text-xs shadow-sm transform active:scale-95 transition-all focus:outline-none">
            Widen Search Radius
          </button>
        </div>

      </div>

    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500 w-full mt-12">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui-common.js"></script>
  <script src="js/browse-rental.js"></script>
</body>
</html>
