<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | RentNest</title>
  <meta name="description" content="Register a new RentNest account via email verification.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#FF385C',
              dark: '#E31C5F',
            },
            surface: '#FFFFFF',
            background: '#F7F7F7',
            textPrimary: '#222222',
            textSecondary: '#717171',
            border: '#DDDDDD',
          },
          borderRadius: {
            custom: '12px',
          },
          boxShadow: {
            card: '0 2px 16px rgba(0,0,0,0.12)',
            hover: '0 4px 24px rgba(0,0,0,0.18)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="assets/style.css">
  <!-- EmailJS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    /* OTP digit boxes styling matching light theme */
    .otp-input {
      width: 52px;
      height: 58px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      background: #FFFFFF;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-primary);
      outline: none;
      transition: all 0.2s;
    }
    .otp-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.15);
    }
    .step-hidden { display: none; }
    .btn-loading { pointer-events: none; opacity: 0.7; }
  </style>
</head>
<body class="bg-[#F7F7F7] text-[#222222] min-h-screen flex flex-col justify-between">

  <!-- Navbar -->
  <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200"></nav>

  <!-- Signup Content -->
  <main class="relative flex-1 flex items-center justify-center px-4 py-16 overflow-hidden">
    <div class="relative z-10 w-full max-w-md">
      <!-- Step Indicator -->
      <div class="flex items-center justify-center mb-8 gap-3">
        <div id="step1Indicator" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm">1</div>
          <span class="text-sm text-primary font-medium hidden sm:inline">Register</span>
        </div>
        <div class="w-12 h-0.5 bg-gray-300 animate-pulse" id="stepConnector"></div>
        <div id="step2Indicator" class="flex items-center gap-2 opacity-45">
          <div class="w-8 h-8 rounded-full border border-gray-400 flex items-center justify-center text-gray-500 font-bold text-sm">2</div>
          <span class="text-sm text-gray-500 font-medium hidden sm:inline">Verify</span>
        </div>
      </div>

      <!-- Surface Card -->
      <div class="bg-white rounded-2xl p-8 sm:p-10 shadow-card border border-gray-100">
        <div class="text-center mb-8">
          <div class="text-4xl mb-3">✨</div>
          <h1 class="text-2xl font-bold tracking-tight text-gray-900" id="authTitle">Create Account</h1>
          <p class="text-gray-500 text-sm mt-1" id="authSubtitle">Enter your email to verify and register</p>
        </div>

        <!-- Step 1: Email Input -->
        <div id="step1">
          <div class="mb-6 relative floating-label-group border border-gray-300 rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-primary/25 focus-within:border-primary transition-all bg-white">
            <input type="email" id="emailInput" placeholder=" " required
              class="peer w-full bg-transparent outline-none text-gray-800 text-base pt-3 pb-1 placeholder-transparent">
            <label for="emailInput" class="absolute left-3 top-1 text-gray-500 text-xs transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3.5 peer-focus:top-1 peer-focus:text-xs peer-focus:text-primary">
              Email Address
            </label>
          </div>
          
          <button id="sendOtpBtn" onclick="handleSendOtp()"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98]">
            Send Registration Code
          </button>
        </div>

        <!-- Step 2: OTP Input -->
        <div id="step2" class="step-hidden">
          <p class="text-center text-gray-500 text-sm mb-6">
            We sent a 6-digit code to <span id="sentEmailDisplay" class="text-primary font-medium"></span>
          </p>
          <div class="flex justify-center gap-3 mb-6" id="otpContainer">
            <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-input" data-index="4" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-input" data-index="5" inputmode="numeric">
          </div>
          
          <button id="verifyOtpBtn" onclick="handleVerifyOtp()"
            class="w-full py-3.5 rounded-lg bg-primary hover:bg-primary-dark text-white font-semibold shadow-sm transition-all duration-200 active:scale-[0.98] mb-4">
            Verify &amp; Register
          </button>
          
          <div class="text-center">
            <button onclick="handleResendOtp()" class="text-sm text-gray-500 hover:text-primary transition-colors underline underline-offset-4">
              Resend Code
            </button>
            <span class="text-gray-300 mx-2">·</span>
            <button onclick="goBackToEmail()" class="text-sm text-gray-500 hover:text-primary transition-colors underline underline-offset-4">
              Change Email
            </button>
          </div>
        </div>

        <div class="mt-6 text-center text-sm text-gray-500">
          Already have an account? 
          <a href="login.html" class="text-primary font-medium hover:underline">Login</a>
        </div>
      </div>

      <p class="text-center text-gray-400 text-xs mt-6">
        By continuing, you agree to RentNest's Terms of Service and Privacy Policy.
      </p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-7xl mx-auto px-4">
      <p>&copy; 2026 RentNest. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui-common.js"></script>
  <script>
    // Redirect if authenticated
    if (isAuthenticated()) {
      window.location.href = 'index.html';
    }

    // OTP auto focus controls
    const otpInputs = document.querySelectorAll('.otp-input');
    otpInputs.forEach((input, i) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val;
        if (val && i < otpInputs.length - 1) {
          otpInputs[i + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && i > 0) {
          otpInputs[i - 1].focus();
        }
      });
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((ch, j) => {
          if (otpInputs[j]) otpInputs[j].value = ch;
        });
        if (pasted.length > 0) otpInputs[Math.min(pasted.length, 5)].focus();
      });
    });

    document.getElementById('emailInput')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSendOtp();
    });

    let storedEmail = '';

    async function handleSendOtp() {
      const email = document.getElementById('emailInput').value.trim();
      if (!email || !email.includes('@')) {
        showToast('Please enter a valid email address.', 'warning');
        return;
      }
      const btn = document.getElementById('sendOtpBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Sending...';
      btn.classList.add('btn-loading');

      const success = await requestSignupOtp(email);
      if (success) {
        storedEmail = email;
        document.getElementById('sentEmailDisplay').textContent = email;
        document.getElementById('step1').classList.add('step-hidden');
        document.getElementById('step2').classList.remove('step-hidden');
        document.getElementById('authTitle').textContent = 'Verify Registration';
        document.getElementById('authSubtitle').textContent = 'Enter the 6-digit code we sent you';
        document.getElementById('step1Indicator').classList.add('opacity-50');
        document.getElementById('step2Indicator').classList.remove('opacity-45');
        document.getElementById('step2Indicator').querySelector('div').classList.add('bg-primary', 'text-white');
        document.getElementById('step2Indicator').querySelector('div').classList.remove('border', 'border-gray-400', 'text-gray-500');
        document.getElementById('stepConnector').classList.add('bg-primary');
        document.getElementById('stepConnector').classList.remove('bg-gray-300');
        otpInputs[0].focus();
      }
      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }

    async function handleVerifyOtp() {
      const otp = Array.from(otpInputs).map(i => i.value).join('');
      if (otp.length !== 6) {
        showToast('Please enter all 6 digits.', 'warning');
        return;
      }
      const btn = document.getElementById('verifyOtpBtn');
      const originalText = btn.textContent;
      btn.textContent = 'Verifying...';
      btn.classList.add('btn-loading');
      
      const success = await verifySignupOtp(storedEmail, otp);
      if (!success) {
        // Shake container on incorrect OTP code
        const container = document.getElementById('otpContainer');
        container.classList.add('shake-element');
        setTimeout(() => container.classList.remove('shake-element'), 500);
      }
      
      btn.textContent = originalText;
      btn.classList.remove('btn-loading');
    }

    async function handleResendOtp() {
      if (!storedEmail) return;
      otpInputs.forEach(i => i.value = '');
      await requestSignupOtp(storedEmail);
      otpInputs[0].focus();
    }

    function goBackToEmail() {
      document.getElementById('step2').classList.add('step-hidden');
      document.getElementById('step1').classList.remove('step-hidden');
      document.getElementById('authTitle').textContent = 'Create Account';
      document.getElementById('authSubtitle').textContent = 'Enter your email to verify and register';
      document.getElementById('step1Indicator').classList.remove('opacity-50');
      document.getElementById('step2Indicator').classList.add('opacity-45');
      otpInputs.forEach(i => i.value = '');
    }
  </script>
</body>
</html>
