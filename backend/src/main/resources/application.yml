# ========================
# RentNest Backend Configuration
# ========================

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-rapid-mountain-aoc6btq8-pooler.c-2.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_1kYcnVZHS9iy&sslmode=require&channelBinding=require}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# ========================
# JWT Configuration
# ========================
jwt:
  secret: ${JWT_SECRET:rentnest-dev-secret-key-change-in-production-min-256-bits-long!!}
  expiration: 86400000  # 24 hours in milliseconds



# ========================
# CORS Configuration
# ========================
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
