# ============================================================
# RentNest — Docker Compose (Local Development)
# ============================================================
# This file orchestrates 3 containers:
#   1. db       — PostgreSQL 15 database
#   2. backend  — Spring Boot API (Java 17)
#   3. frontend — Nginx serving static HTML/JS/CSS
#
# Usage:
#   docker compose up --build        (start everything)
#   docker compose up --build -d     (start in background)
#   docker compose logs -f           (watch logs)
#   docker compose down              (stop everything)
#   docker compose down -v           (stop + delete database data)
# ============================================================

services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: rentnest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentnest}
      POSTGRES_USER: ${POSTGRES_USER:-rentnest_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentnest_pass}
    ports:
      - "5433:5432"
    volumes:
      # Named volume — your database data persists even after "docker compose down"
      # Use "docker compose down -v" to wipe it clean
      - rentnest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentnest_user} -d ${POSTGRES_DB:-rentnest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rentnest-network

  # ==========================================
  # 2. Spring Boot Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentnest-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy  # Wait until PostgreSQL is ready
    environment:
      # Respect DATABASE_URL from .env if defined, otherwise default to local database container
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://db:5432/rentnest?user=rentnest_user&password=rentnest_pass}
      JWT_SECRET: ${JWT_SECRET:-rentnest-dev-secret-key-change-in-production-min-256-bits-long!!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "8081:8080"
    networks:
      - rentnest-network

  # ==========================================
  # 3. Nginx Frontend
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentnest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # Access the full application at http://localhost
      - "80:80"
    networks:
      - rentnest-network

# ==========================================
# Shared Network (containers can talk to each other by service name)
# ==========================================
networks:
  rentnest-network:
    driver: bridge

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  rentnest-db-data:
