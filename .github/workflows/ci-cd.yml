# ============================================================
# RentNest — CI/CD Pipeline (GitHub Actions)
# ============================================================
# This workflow runs automatically when you:
#   - Push code to the "main" branch
#   - Open a Pull Request targeting "main"
#
# What it does:
#   Job 1: Compile Java backend + run unit tests
#   Job 2: Build Docker images for backend & frontend
#   Job 3: Push Docker images to GitHub Container Registry (GHCR)
# ============================================================

name: RentNest CI/CD

# When does this pipeline run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions needed for GHCR image publishing
permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Job 1: Test the Backend (Java / Maven)
  # ==========================================
  test-backend:
    name: 🧪 Test Backend
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Cache Maven dependencies (speeds up builds by ~60%)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Step 4: Compile and run tests
      - name: Build and test with Maven
        working-directory: backend
        run: mvn clean verify -B
        env:
          # Use an in-memory H2 database for tests (no real PostgreSQL needed)
          # If your tests require PostgreSQL, you can add a service container above
          SPRING_PROFILES_ACTIVE: test

  # ==========================================
  # Job 2: Build & Push Docker Images
  # ==========================================
  build-and-push:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test-backend  # Only runs if tests pass
    # Only push images on main branch pushes (not on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry (GHCR)
      # This uses the automatic GITHUB_TOKEN — no extra setup needed!
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for advanced build features (caching, multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push the BACKEND image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push the FRONTEND image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print a summary of what was published
      - name: Summary
        run: |
          echo "## 🚀 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`ghcr.io/${{ github.repository }}/backend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`ghcr.io/${{ github.repository }}/frontend:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
